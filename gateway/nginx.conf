events {}

http {
    server {
        listen 80;

        location /api/customers {
            proxy_pass http://customer-service:3001/customers;
        }
         location /api/accounts {
            proxy_pass http://account-service:3002/accounts;
        }
        location /api/payments {
            proxy_pass http://payment-service:3003/payments;
        }
    }
}