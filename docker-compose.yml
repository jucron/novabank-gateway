services:

  customer-service:
    build:
      context: .
      dockerfile: services/customer/Dockerfile
    ports:
      - "3001:3001"

  account-service:
    build:
      context: .
      dockerfile: services/account/Dockerfile
    ports:
      - "3002:3002"

  payment-service:
    build:
      context: .
      dockerfile: services/payment/Dockerfile
    ports:
      - "3003:3003"

  auth-service:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    ports:
      - "3004:3004"

  gateway-health:
    build:
      context: .
      dockerfile: services/gateway-health/Dockerfile
    ports:
      - "3005:3005"
    depends_on:
      - customer-service
      - account-service
      - payment-service
      - auth-service

  gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway-health