services:

  customer-service:
    build:
      context: .
      dockerfile: services/customer/Dockerfile
    ports:
      - "3001:3001"

  account-service:
    build:
      context: .
      dockerfile: services/account/Dockerfile
    ports:
      - "3002:3002"

  payment-service:
    build:
      context: .
      dockerfile: services/payment/Dockerfile
    ports:
      - "3003:3003"


  gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - customer-service