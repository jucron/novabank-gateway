apis:
  customers:
    path: /customers
    target: customer-service
    isPathDynamic: true
    auth:
      type: jwt
      secret: novabank-dev-secret

  accounts:
    path: /accounts
    target: account-service
    isPathDynamic: true
    auth:
      enabled: true
      credentials:
        alice: password123
        bob: password456

  payments:
    path: /payments
    target: payment-service
    isPathDynamic: true
    auth:
      type: api-key
      header: X-API-Key
      keys:
        development-key: development-client

  auth:
    path: /auth
    target: auth-service
    isPathDynamic: true
    auth:
      type: disabled

  gateway-health:
    path: /health
    target: gateway-health
    isPathDynamic: false
    auth:
      type: disabled